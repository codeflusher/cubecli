[package]
name = "cubecli-runtime"
description = "Server process management, RCON, and service installation for cubecli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cubecli-core = { path = "../cubecli-core" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
futures-util = "0.3.34"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "process", "io-util", "net", "time", "sync", "macros", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
