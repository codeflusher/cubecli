[package]
name = "cubecli-tui"
description = "Terminal UI screens for cubecli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cubecli-core = { path = "../cubecli-core" }
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = "0.30.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7.20"

[dev-dependencies]
tempfile = "3"
